name: Build Purity brochure PDF

# Renders and checks the Purity PVC tarpaulin brochure. It uploads a workflow artifact only:
# no release or website deploy until the owner decides where the brochure is published.
on:
  push:
    branches: [master]
    paths:
      - "purity/index.html"
      - "purity/styles.css"
      - "purity/assets/**"
      - "purity/tools/**"
      - "brochure/tools/build.py"
      - "brochure/tools/render.sh"
      - "brochure/assets/fonts/**"
      - ".github/workflows/purity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PDF: output/purity-pvc-tarpaulin-brochure.pdf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Render PDF
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: brochure/tools/render.sh purity purity-pvc-tarpaulin-brochure.pdf

      - name: Verify PDF
        run: |
          info="$(pdfinfo "$PDF")"
          echo "$info"
          pages=$(awk '/^Pages:/ {print $2}' <<<"$info")
          bytes=$(stat -c %s "$PDF")
          [ "$pages" -eq 6 ] || { echo "::error::Expected 6 pages, got $pages"; exit 1; }
          [ "$bytes" -lt 10485760 ] || { echo "::error::PDF is $bytes bytes (limit 10 MB)"; exit 1; }
          grep -qE '^Page size:.*\(A4\)' <<<"$info" || { echo "::error::Page size is not A4"; exit 1; }
          # The Purity price list (docs/purity/) is internal: no prices, rates or GST in buyer material
          if grep -rniE "₹|INR|GST [0-9]|[0-9]+ ?% GST|/ ?sq\.?(m|ft)|selling price|rate per|malson|CM/L|IN122639|/kg" purity/index.html purity/assets; then
            echo "::error::Internal price or manufacturer-only details found in the Purity brochure"; exit 1
          fi
          # Crosspaulin's terms and certifications must not carry over to Purity
          if grep -rniE "24 MT|35.40 days|14611|3926" purity/index.html; then
            echo "::error::Crosspaulin-only terms found in the Purity brochure"; exit 1
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: purity-pvc-tarpaulin-brochure
          path: |
            ${{ env.PDF }}
            purity/review/pages/*.png
