    <text x="510" y="188" font-size="20" font-weight="700">Inner layers</text>
    <text x="510" y="208" font-size="15.5" fill="#4B5563">polyethylene film, laminated</text>
    <text x="510" y="278" font-size="20" font-weight="700">Outer film</text>
