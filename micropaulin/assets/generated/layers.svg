  <path d="M60 216h320M75 204h320M90 192h320M105 180h320M120 168h320" stroke="#C7CFDD" stroke-width="2.5" clip-path="url(#mid)"/>
  <clipPath id="mid"><path d="M40 232L360 232L460 152L140 152z"/></clipPath>
  <path d="M40 142L360 142L460 62L140 62z" fill="#B8BEC8"/><path d="M170 82L420 82L400 98L150 98z" fill="#fff" opacity=".45"/><path d="M40 142h320v12H40z" fill="#8C939F"/><path d="M360 142l100 -80v12l-100 80z" fill="#A1A8B3"/>
